# Підказка увімкнути сповіщення (плаваюча картка після входу)
title: "Увімкніть сповіщення"
text: "Щоб не пропустити нові завдання і нагадування по контрольних."
enable: "Увімкнути"
later: "Не зараз"
ios_title: "Додайте «Контроль» на екран «Додому»"
ios_text: "На iPhone сповіщення працюють лише так: у Safari натисніть «Поділитися» → «На екран «Додому»», відкрийте застосунок з іконки й увімкніть сповіщення."
