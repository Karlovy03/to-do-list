# Production: Caddy (HTTPS, the only public entry) → app → PostgreSQL.
# Secrets come from the .env next to this file (see .env.example). Deploy with scripts/deploy.sh.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    # small server (1 GB RAM): modest buffers and few connections are enough for this app
    command: postgres -c shared_buffers=64MB -c max_connections=20
    environment:
      POSTGRES_DB: kontrol
      POSTGRES_USER: kontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Europe/Kyiv
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontrol -d kontrol"]
      interval: 5s
      retries: 20

  app:
    build: .
    image: kontrol-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_OPTIONS: --max-old-space-size=256
      DATABASE_URL: postgresql://kontrol:${POSTGRES_PASSWORD}@db:5432/kontrol
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      TRUST_PROXY_HOPS: 1
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      FILES_MAX_TOTAL_MB: ${FILES_MAX_TOTAL_MB:-5000}
    # files of «Шаблони» (ADR-0023): on disk, outside the database; scripts/backup.sh copies them too
    volumes:
      - files_data:/app/files

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  files_data:
  caddy_data:
  caddy_config:
